[build]
  command = "npm run build"
  publish = "dist"

# Las políticas legales se publicaron primero con nombres largos. Redirección
# permanente (301) en lugar de las páginas meta-refresh generadas por Astro.
[[redirects]]
  from = "/politica-de-privacidad"
  to = "/privacidad"
  status = 301

[[redirects]]
  from = "/terminos-y-condiciones"
  to = "/terminos"
  status = 301

# Las conversiones de PDF a imagen se sirven ahora bajo /convertir/.
[[redirects]]
  from = "/pdf/pdf-a-jpg"
  to = "/convertir/pdf-a-jpg"
  status = 301

[[redirects]]
  from = "/pdf/pdf-a-png"
  to = "/convertir/pdf-a-png"
  status = 301

[[headers]]
  for = "/assets/wasm/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/pdf/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"
